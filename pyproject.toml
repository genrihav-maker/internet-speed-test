[project]
name = "internet-speed-test"
version = "1.1.0"
description = "Замер скорости интернета: CLI-скрипт"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
internet-speed-test = "src.speed_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "bumpver>=2026.1132",
    "mypy>=1.14",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bumpver]
current_version = "1.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "бамп версии {old_version} -> {new_version}"
commit = true
tag = true
push = false
tag_message = "v{new_version}"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/__init__.py" = [
    '__version__ = "{version}"',
]
