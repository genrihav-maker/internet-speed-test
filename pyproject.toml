[project]
name = "internet-speed-test"
version = "1.0.1"
description = "Замер скорости интернета: CLI-скрипт"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "bumpver>=2026.1132",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bumpver]
current_version = "1.0.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "бамп версии {old_version} -> {new_version}"
commit = true
tag = true
push = false
tag_message = "v{new_version}"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/__init__.py" = [
    '__version__ = "{version}"',
]

[tool.uv]
package = false
